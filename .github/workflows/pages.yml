name: Publish control page
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/hub_ble_test.cpp -o /tmp/hub-ble-test && /tmp/hub-ble-test
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/hub_routine_test.cpp -o /tmp/hub-routine-test && /tmp/hub-routine-test
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/hub_channels_test.cpp -o /tmp/hub-channels-test && /tmp/hub-channels-test
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/hub_calibration_test.cpp -o /tmp/hub-calibration-test && /tmp/hub-calibration-test
      - run: g++ -std=c++17 -Wall -Wextra -pedantic tests/hub_pwm_test.cpp -o /tmp/hub-pwm-test && /tmp/hub-pwm-test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
